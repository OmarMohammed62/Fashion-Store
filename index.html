<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Fashion Store</h1>
    <p>Welcome to Fashion Store</p>
    <section>
        <h2>Our Products</h2>
        <div class="products">
    <div class="classic-t-shirt">  
            <h3>Classic T-Shirt</h3>
            <p>$25</p>
            <img src="shirt.jpeg" alt="Classic T-Shirt">
            <button>Add to Cart</button>
        </div>
        <div class="hoodie">
            <h3>Hoodie</h3>
            <p>$40</p>
            <img src="hoodie.jpeg" alt="Hoodie">
            <button>Add to Cart</button>
        </div>
        <div class="jeans">
            <h3>Jeans</h3>
            <p>$50</p>
            <img src="jeans.jpeg" alt="Jeans">
            <button>Add to Cart</button>
        </div>
        <div class="sneakers">
            <h3>Sneakers</h3>
            <p>$60</p>
            <img src="sneakers.jpeg" alt="Sneakers">
            <button>Add to Cart</button>
        </div>
        <div class="jacket">
             <h3>Jacket</h3>
             <p>$70</p>
             <img src="jacket.jpeg" alt="Jacket">
             <button>Add to Cart</button>
        </div>
        <div class="sweatshirt">
            <h3>Sweatshirt</h3>
            <p>$45</p>
            <img src="sweatshirt.jpeg" alt="Sweatshirt">
            <button>Add to Cart</button>
        </div>
        <div class="cap">
            <h3>Cap</h3>
            <p>$20</p>
            <img src="cap.jpeg" alt="Cap">
            <button>Add to Cart</button>
        </div>
        <div class="poloshirt">
            <h3>Polo Shirt</h3>
            <p>$35</p>
            <img src="polo shirt.jpeg" alt="Polo Shirt">
            <button>Add to Cart</button>
        </div>
        <div class="shorts">
            <h3>Shorts</h3>
            <p>$30</p>
            <img src="short.jpeg" alt="Shorts">
             <button>Add to Cart</button>
        </div>
        <div class="dress">
            <h3>Dress</h3>
            <p>$60</p>
            <img src="dress.jpeg" alt="Dress">
            <button>Add to Cart</button>
        </div>
        <div class="coat">
            <h3>Coat</h3>
            <p>$90</p>
            <img src="coat.jpeg" alt="Coat">
            <button>Add to Cart</button>
        </div>
        <div class="backpack">
            <h3>Backpack</h3>
            <p>$55</p>
            <img src="backpack.jpeg" alt="Backpack">
            <button>Add to Cart</button>
        </div>
     </div>
    </section>
     <script src="script.js"></script>
</body>
</html>
